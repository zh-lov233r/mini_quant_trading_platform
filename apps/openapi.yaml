        close: {type: number, nullable: true}
        equity: {type: number}
        return: {type: number, nullable: true}

    BacktestComparisonCurves:
      type: object
      required: [run_id, comparison_curves]
      properties:
        run_id: {type: string, format: uuid}
        comparison_curves:
          type: object
          additionalProperties:
            type: array
            items: {$ref: "#/components/schemas/BacktestComparisonCurvePoint"}

    PortfolioSnapshotRecord:
      type: object
      required: [id, run_id, ts, cash, equity, positions, metrics]
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        cash:
          type: number
        equity:
          type: number
        gross_exposure:
          type: number
          nullable: true
        net_exposure:
          type: number
          nullable: true
        drawdown:
          type: number
          nullable: true
        positions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PositionSnapshotEntry"
        metrics:
          $ref: "#/components/schemas/FreeFormObject"
        created_at:
          type: string
          format: date-time
          nullable: true

    HistoricalBar:
      type: object
      required: [symbol, instrument_id, ts_utc, trade_date]
      properties:
        symbol:
          type: string
        instrument_id:
          type: integer
        ts_utc:
          type: string
          format: date-time
        trade_date:
          type: string
          format: date
        open_px:
          type: number
          nullable: true
        high_px:
          type: number
          nullable: true
        low_px:
          type: number
          nullable: true
        close_px:
          type: number
          nullable: true
        volume:
          type: integer
          nullable: true
        trades:
          type: integer
          nullable: true

    HistoricalBarsResponse:
      type: object
      required: [bars_by_symbol]
      properties:
        bars_by_symbol:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/HistoricalBar"

    InstrumentSummary:
      type: object
      properties:
        instrument_id:
          type: integer
        ticker_canonical:
          type: string
          nullable: true
        exchange:
          type: string
        mic:
          type: string
          nullable: true
        asset_type:
          type: string
        name:
          type: string
          nullable: true
        currency:
          type: string
        country:
          type: string
          nullable: true
        is_active:
          type: boolean

    OrderCreate:
      type: object
      required: [symbol, qty, side, type]
      properties:
        symbol:
          type: string
          example: AAPL
        qty:
          type: integer
          minimum: 1
        side:
          $ref: "#/components/schemas/BrokerOrderSide"
        type:
          $ref: "#/components/schemas/BrokerOrderType"
        tif:
          type: string
          enum: [day, gtc]
          default: day
        limit_price:
          type: number
          nullable: true

    OrderResponse:
      type: object
      properties:
        id:
          type: string
          nullable: true
        client_order_id:
          type: string
          nullable: true
        symbol:
          type: string
          nullable: true
        qty:
          oneOf:
            - type: string
            - type: integer
            - type: number
          nullable: true
        side:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        time_in_force:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        filled_qty:
          oneOf:
            - type: string
            - type: integer
            - type: number
          nullable: true
        filled_avg_price:
          oneOf:
            - type: string
            - type: number
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        raw:
          $ref: "#/components/schemas/FreeFormObject"

    Position:
      type: object
      properties:
        symbol:
          type: string
        qty:
          oneOf:
            - type: string
            - type: integer
            - type: number
        avg_entry_price:
          oneOf:
            - type: string
            - type: number
          nullable: true
        market_value:
          oneOf:
            - type: string
            - type: number
          nullable: true
        unrealized_pl:
          oneOf:
            - type: string
            - type: number
          nullable: true
        raw:
          $ref: "#/components/schemas/FreeFormObject"

    RebalanceRequest:
      type: object
      required: [strategy_id, trade_date, dry_run]
      properties:
        strategy_id:
          type: string
          format: uuid
        trade_date:
          type: string
          format: date
        mode:
          type: string
          enum: [paper, live]
          default: paper
        symbols:
          type: array
          items:
            type: string
          nullable: true
        dry_run:
          type: boolean
          default: true

    RebalanceResponse:
      type: object
      properties:
        dry_run:
          type: boolean
        trade_date:
          type: string
          format: date
        mode:
          type: string
        run_ids:
          type: array
          items:
            type: string
            format: uuid
        orders:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/OrderResponse"
              - $ref: "#/components/schemas/FreeFormObject"
  /api/backtests/{run_id}/summary:
    get:
      tags: [Backtests]
      summary: Get compact backtest summary
      operationId: getBacktestSummary
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
      responses:
        "200":
          description: Exact metrics, persistence availability, progress, and latest snapshot
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BacktestSummary"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/backtests/{run_id}/equity:
    get:
      tags: [Backtests]
      summary: Get a deterministic downsampled equity curve
      operationId: getBacktestEquity
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
        - in: query
          name: max_points
          required: false
          schema: {type: integer, minimum: 2, maximum: 5000, default: 1500}
        - in: query
          name: shape
          required: false
          description: Compact chart points omit positions and full metrics; snapshot preserves the legacy payload.
          schema: {type: string, enum: [chart, snapshot], default: snapshot}
      responses:
        "200":
          description: First/last preserving min/max bucket curve
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - {$ref: "#/components/schemas/BacktestEquityPoint"}
                    - {$ref: "#/components/schemas/PortfolioSnapshotRecord"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/backtests/{run_id}/comparison-curves:
    get:
      tags: [Backtests]
      summary: Get lightweight market comparison curves for the run's market
      operationId: getBacktestComparisonCurves
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
        - in: query
          name: max_points
          required: false
          schema: {type: integer, minimum: 2, maximum: 5000, default: 1500}
      responses:
        "200":
          description: A-share runs return Shanghai Composite and Shenzhen Component curves; other runs return SPY and QQQ, with deterministic endpoint-preserving downsampling.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BacktestComparisonCurves"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/backtests/{run_id}/cancel:
    post:
      tags: [Backtests]
      summary: Request cancellation of a queued or running backtest
      operationId: cancelBacktest
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BacktestRun"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
