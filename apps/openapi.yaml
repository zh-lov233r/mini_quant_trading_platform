        deleted_live_runs: {type: integer, minimum: 0}
        deleted_backtest_snapshots: {type: integer, minimum: 0}
        deleted_signals: {type: integer, minimum: 0}
        deleted_transactions: {type: integer, minimum: 0}
        deleted_allocations: {type: integer, minimum: 0}
        deleted_support_resistance_run_events: {type: integer, minimum: 0}
        deleted_support_resistance_run_links: {type: integer, minimum: 0}
        retained_support_resistance_materializations: {type: integer, minimum: 0}

    StrategyValidation:
