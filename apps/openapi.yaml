            - type: string
            - type: number
          nullable: true
        raw:
          $ref: "#/components/schemas/FreeFormObject"

    RebalanceRequest:
      type: object
      required: [strategy_id, trade_date, dry_run]
      properties:
        strategy_id:
          type: string
          format: uuid
        trade_date:
          type: string
          format: date
        mode:
          type: string
          enum: [paper, live]
          default: paper
        symbols:
          type: array
          items:
            type: string
          nullable: true
        dry_run:
          type: boolean
          default: true

    RebalanceResponse:
      type: object
      properties:
        dry_run:
          type: boolean
        trade_date:
          type: string
          format: date
        mode:
          type: string
        run_ids:
          type: array
          items:
            type: string
            format: uuid
        orders:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/OrderResponse"
              - $ref: "#/components/schemas/FreeFormObject"
