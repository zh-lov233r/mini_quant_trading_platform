          $ref: "#/components/schemas/MetadataConfig"

    MomentumBreakoutStrategyParams:
      type: object
      description: >-
        Daily momentum breakout parameters using existing forward-adjusted-when-available
        (otherwise unadjusted) close, SMA20, 20-day return, and volume features. Signals are evaluated at the
        day-T close and backtest fills occur at the next available session open.
      required: [signal, universe, risk, execution, metadata]
      properties:
        signal:
          type: object
          required:
            [minimum_return_20d, breakout_buffer_pct, volume_multiplier,
             exit_return_20d, price_field]
          properties:
            minimum_return_20d:
              type: number
              exclusiveMinimum: 0
              maximum: 1
            breakout_buffer_pct:
              type: number
              exclusiveMinimum: 0
              maximum: 1
            volume_multiplier:
              type: number
              exclusiveMinimum: 0
            exit_return_20d:
              type: number
              minimum: -1
              maximum: 1
            price_field:
              type: string
              enum: [close]
            min_strength_score:
              type: number
              minimum: 0
              maximum: 100
              default: 50
        universe:
          $ref: "#/components/schemas/UniverseConfig"
        risk:
          type: object
          required: [max_positions, position_size_pct, stop_loss_pct, take_profit_pct]
          properties:
            max_positions:
              type: integer
              minimum: 1
            position_size_pct:
              type: number
              exclusiveMinimum: 0
              maximum: 1
            stop_loss_pct:
              type: number
              exclusiveMinimum: 0
              maximum: 1
            take_profit_pct:
              type: number
              exclusiveMinimum: 0
              maximum: 1
        execution:
          $ref: "#/components/schemas/ExecutionConfig"
        metadata:
          $ref: "#/components/schemas/MetadataConfig"

    IslandReversalStrategyParams:
      type: object
      description: Revision 2. Daily close signals; fills at the next valid session open. Defaults are initial quantification, not optimized values.
      required: [signal, universe, risk, execution, metadata]
      properties:
        signal:
          type: object
          required: [breakout_body_atr_min, downtrend_lookback, downtrend_min_drop_pct, exhaustion_body_atr_max, island_body_atr_max, left_gap_min_pct, left_volume_ratio_max, max_island_bars, min_island_bars, min_strength_score, previous_body_atr_min, retest_volume_ratio_max, retest_window, right_gap_min_pct, right_volume_ratio_min, support_tolerance_pct]
