      properties:
        id:
          type: string
          format: uuid
        strategy_key:
          type: string
        display_name:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        strategy_type:
          type: string
        params:
          $ref: "#/components/schemas/FreeFormObject"
        status:
          type: string
