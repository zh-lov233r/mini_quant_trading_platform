          additionalProperties:
            type: array
            minItems: 1
        costScenarios:
          type: array
          minItems: 2
          maxItems: 5
          items: {$ref: "#/components/schemas/CostScenario"}
        initialCash: {type: number, exclusiveMinimum: 0}
        benchmarkSymbol: {type: [string, "null"]}

    ExperimentCreate:
      type: object
      required: [workflowRunId, spec]
      properties:
        workflowRunId: {type: string}
        spec: {$ref: "#/components/schemas/ExperimentSpec"}

    ExperimentValidation:
      type: object
      required: [valid, trialCount, normalizedSpec, universeSymbols, warnings, estimatedCost]
      properties:
        valid: {type: boolean}
        trialCount: {type: integer, maximum: 50}
        normalizedSpec: {$ref: "#/components/schemas/ExperimentSpec"}
        universeSymbols:
          type: array
          items: {type: string}
        warnings:
          type: array
          items: {type: string}
        estimatedCost:
          type: object
          required: [backtestRuns, maxConcurrentTrials, llmAnalysisCalls]
          properties:
            backtestRuns: {type: integer}
            maxConcurrentTrials: {type: integer}
            llmAnalysisCalls: {type: integer}

    ResearchExperiment:
