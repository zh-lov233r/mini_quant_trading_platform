openapi: 3.1.0
info:
  title: Quant Trading System API
  version: "1.2.0"
  description: >
    OpenAPI specification for the current quant-trading-system project.
    It is organized around the real backend domain model:
    Strategy -> StrategyRun -> Signal / Transaction / PortfolioSnapshot,
    plus market-data and broker-trading integrations.

    Notes:
    - Operations marked with x-implementation-status: implemented are already reflected by the current FastAPI codebase.
    - Operations marked with x-implementation-status: planned are aligned with existing service-layer and database structure,
      and are intended to guide the next API/router implementation pass.
servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: Health
    description: Service health and root endpoints.
  - name: Strategies
    description: Strategy catalog, CRUD-style reads, and runtime configuration views.
  - name: Backtests
    description: Backtest creation and backtest-run inspection.
  - name: Research
    description: Deterministic research experiment status, trials, and reports.
  - name: Agent Integration
    description: Service-token protected strategy and experiment mutation endpoints.
  - name: Runs
    description: Generic strategy-run queries across backtest / paper / live modes.
  - name: Market
    description: Historical bar data, instrument lookup, and market reference data.
  - name: Trading
    description: Broker-facing order placement, position inspection, and rebalance workflows.
  - name: Paper Trading
    description: Manual and scheduled Alpaca paper-strategy execution.

paths:
  /:
    get:
      tags: [Health]
      summary: Root endpoint
      operationId: getRoot
      x-implementation-status: implemented
      responses:
        "200":
          description: Service metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootResponse"

  /healthz:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealthz
      x-implementation-status: implemented
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/strategies/catalog:
    get:
      tags: [Strategies]
      summary: List strategy templates supported by the registry
      operationId: listStrategyCatalog
      x-implementation-status: implemented
      responses:
        "200":
          description: Strategy catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyCatalogItem"

  /api/strategies:
    get:
      tags: [Strategies]
      summary: List stored strategies
      operationId: listStrategies
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/StrategyStatusFilter"
        - $ref: "#/components/parameters/StrategyTypeFilter"
        - $ref: "#/components/parameters/StrategyNameFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Strategy list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyOut"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    post:
      tags: [Strategies]
      summary: Create a strategy definition
      operationId: createStrategy
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyCreate"
      responses:
        "201":
          description: Strategy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyOut"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/strategies/validate:
    post:
      tags: [Strategies]
      summary: Validate and normalize strategy parameters without persisting
      operationId: validateStrategy
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyCreate"
      responses:
        "200":
          description: Valid normalized strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyValidation"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/strategies/{strategy_id}/clone:
    post:
      tags: [Strategies]
      summary: Create an independent draft from an existing strategy configuration
      operationId: cloneStrategyAsIndependentDraft
      x-implementation-status: implemented
      parameters:
        - name: strategy_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyCloneCreate"
      responses:
        "201":
          description: Independent v1 draft created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyOut"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/strategies/proposals/validate:
    post:
      tags: [Strategies]
      summary: Resolve a bounded Agent proposal against engine-ready catalog defaults
      operationId: validateStrategyProposal
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyProposal"
      responses:
        "200":
          description: Final draft-only strategy create payload
          content:
            application/json:
              schema:
                type: object
                required: [valid, strategy]
                properties:
                  valid: {type: boolean}
                  strategy: {$ref: "#/components/schemas/StrategyCreate"}
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/agent/strategies:
    post:
      tags: [Agent Integration]
      summary: Create an immutable draft strategy from an approved Agent proposal
      operationId: createAgentDraftStrategy
      x-implementation-status: implemented
      security:
        - AgentServiceToken: []
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyCreate"
      responses:
        "201":
          description: Draft strategy created or replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/agent/strategies/{strategy_id}/archive-unused-research-draft:
    post:
      tags: [Agent Integration]
      summary: Archive an unreferenced auto-created research draft owned by the workflow
      operationId: archiveUnusedAgentResearchDraft
      security: [{AgentServiceToken: []}]
      parameters:
        - name: strategy_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/RequiredIdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflowRunId]
              properties: {workflowRunId: {type: string}}
      responses:
        "200": {description: Archived or already archived draft, content: {application/json: {schema: {$ref: "#/components/schemas/StrategyOut"}}}}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/agent/research/category-studies/validate:
    post:
      tags: [Agent Integration]
      summary: Validate a generated engine-category draft and first adaptive round
      operationId: validateAgentCategoryStudy
      x-implementation-status: implemented
      security:
        - AgentServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryStudyValidationRequest"
      responses:
        "200":
          description: Normalized specification and bounded trial count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryStudyValidation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/agent/research/category-studies:
    post:
      tags: [Agent Integration]
      summary: Create a persistent adaptive category study after experiment approval
      operationId: createAgentCategoryStudy
      x-implementation-status: implemented
      security:
        - AgentServiceToken: []
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryStudyCreate"
      responses:
        "201":
          description: Experiment created or replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchExperiment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/agent/research/experiments/{experiment_id}/rounds:
    post:
      tags: [Agent Integration]
      summary: Submit the next bounded adaptive candidate round
      operationId: submitAgentExperimentRound
      security: [{AgentServiceToken: []}]
      parameters:
        - $ref: "#/components/parameters/ExperimentIdPath"
        - $ref: "#/components/parameters/RequiredIdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExperimentRoundSubmit"}
      responses:
        "200": {description: Updated experiment, content: {application/json: {schema: {$ref: "#/components/schemas/ResearchExperiment"}}}}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}

  /api/agent/research/experiments/{experiment_id}/controller-failure:
    post:
      tags: [Agent Integration]
      summary: Terminate an adaptive experiment when its Agent controller cannot continue
      operationId: failAgentExperimentController
      security: [{AgentServiceToken: []}]
      parameters:
        - $ref: "#/components/parameters/ExperimentIdPath"
        - $ref: "#/components/parameters/RequiredIdempotencyKeyHeader"
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ControllerFailure"}}}
      responses:
        "200": {description: Terminal experiment, content: {application/json: {schema: {$ref: "#/components/schemas/ResearchExperiment"}}}}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/agent/research/experiments/{experiment_id}/candidates/promote:
    post:
      tags: [Agent Integration]
      summary: Save up to five Pareto rank 1-2 candidates as visible drafts
      operationId: promoteAgentExperimentCandidates
      security: [{AgentServiceToken: []}]
      parameters:
        - $ref: "#/components/parameters/ExperimentIdPath"
        - $ref: "#/components/parameters/RequiredIdempotencyKeyHeader"
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CandidatePromotion"}}}
      responses:
        "200": {description: Promoted draft strategy IDs}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}

  /api/agent/research/experiments/{experiment_id}/cancel:
    post:
      tags: [Agent Integration]
      summary: Request cancellation of an experiment
      operationId: cancelAgentExperiment
      x-implementation-status: implemented
      security:
        - AgentServiceToken: []
      parameters:
        - $ref: "#/components/parameters/ExperimentIdPath"
      responses:
        "200":
          description: Current experiment state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchExperiment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/agent/research/experiments/{experiment_id}/usage:
    post:
      tags: [Agent Integration]
      summary: Synchronize absolute AgentOps token usage and enforce the experiment stop policy
      operationId: updateAgentExperimentTokenUsage
      x-implementation-status: implemented
      security:
        - AgentServiceToken: []
      parameters:
        - $ref: "#/components/parameters/ExperimentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentTokenUsageUpdate"
      responses:
        "200":
          description: Current experiment state after idempotent absolute usage synchronization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchExperiment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/agent/research/experiments/{experiment_id}/report/retry:
    post:
      tags: [Agent Integration]
      summary: Idempotently retry effectiveness-study report generation
      operationId: retryAgentEffectivenessReport
      security: [{AgentServiceToken: []}]
      parameters:
        - $ref: "#/components/parameters/ExperimentIdPath"
      responses:
        "200": {description: Updated parent experiment, content: {application/json: {schema: {$ref: "#/components/schemas/ResearchExperiment"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}

  /api/research/experiments:
    get:
      tags: [Research]
      summary: List research experiments
      operationId: listResearchExperiments
      x-implementation-status: implemented
      responses:
        "200":
          description: Research experiments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchExperiment"

  /api/research/worker-status:
    get:
      tags: [Research]
      summary: Get research trial scheduler status
      operationId: getResearchWorkerStatus
      x-implementation-status: implemented
      responses:
        "200":
          description: Research scheduler state, capacity, active trials, and queued trials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchWorkerStatus"

  /api/research/experiments/{experiment_id}:
    get:
      tags: [Research]
      summary: Get a research experiment
      operationId: getResearchExperiment
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/ExperimentIdPath"
      responses:
        "200":
          description: Research experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchExperiment"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/research/experiments/{experiment_id}/trials:
    get:
      tags: [Research]
      summary: List stable ordered experiment trials
      operationId: listResearchExperimentTrials
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/ExperimentIdPath"
      responses:
        "200":
          description: Experiment trials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExperimentTrial"

  /api/research/experiments/{experiment_id}/trials/{trial_id}/cancel:
    post:
      tags: [Research]
      summary: Idempotently cancel one research trial
      description: >
        Queued trials are cancelled immediately. Trials already submitted to the backtest queue
        use cooperative backtest cancellation. A trial between claim and queue submission records
        a cancellation request that is checked again before enqueueing.
      operationId: cancelResearchExperimentTrial
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/ExperimentIdPath"
        - {in: path, name: trial_id, required: true, schema: {type: string, format: uuid}}
      responses:
        "202":
          description: Trial cancellation accepted, or the trial was already terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentTrial"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/research/experiments/{experiment_id}/backtests/{run_id}:
    delete:
      tags: [Research]
      summary: Delete one terminal research backtest while retaining experiment evidence
      operationId: deleteResearchBacktest
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/ExperimentIdPath"
        - $ref: "#/components/parameters/RunIdPath"
      responses:
        "200":
          description: Run artifacts deleted; the owning trial or candidate keeps a deletion tombstone
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BacktestDeleteResult"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/research/experiments/{experiment_id}/report:
    get:
      tags: [Research]
      summary: Get the deterministic robustness report
      operationId: getResearchExperimentReport
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/ExperimentIdPath"
      responses:
        "200":
          description: Robustness report linked to underlying trials and backtests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeFormObject"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/research/experiments/{experiment_id}/children:
    get:
      tags: [Research]
      summary: List child experiments of a parent effectiveness study
      operationId: listResearchExperimentChildren
      parameters: [{$ref: "#/components/parameters/ExperimentIdPath"}]
      responses:
        "200": {description: Ordered child experiments, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ResearchExperiment"}}}}}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/research/experiments/{experiment_id}/report-artifacts/{artifact_kind}:
    get:
      tags: [Research]
      summary: Download a generated JSON, Markdown, or PDF report artifact
      operationId: downloadResearchReportArtifact
      parameters:
        - $ref: "#/components/parameters/ExperimentIdPath"
        - in: path
          name: artifact_kind
          required: true
          schema: {type: string, enum: [json, markdownZh, markdownEn, pdfZh, pdfEn]}
      responses:
        "200": {description: Generated report artifact}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/strategies/{strategy_id}:
    get:
      tags: [Strategies]
      summary: Get a single strategy
      operationId: getStrategy
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/StrategyIdPath"
      responses:
        "200":
          description: Strategy detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyOut"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Strategies]
      summary: Delete a strategy and its run-scoped records while retaining shared support/resistance caches
      operationId: deleteStrategy
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/StrategyIdPath"
        - in: query
          name: close_positions
          required: false
          description: Explicitly authorize closing matching Alpaca positions before deletion.
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: Deletion counts, including retained shared support/resistance materializations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyDeleteOut"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: Broker position inspection or explicit close failed

  /api/research/experiments/{experiment_id}/rounds:
    get:
      tags: [Research]
      summary: List adaptive rounds; legacy experiments return an empty list
      operationId: listResearchExperimentRounds
      parameters: [{$ref: "#/components/parameters/ExperimentIdPath"}]
      responses:
        "200": {description: Adaptive rounds, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ExperimentRound"}}}}}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/research/experiments/{experiment_id}/candidates:
    get:
      tags: [Research]
      summary: List adaptive candidates and Pareto ranks; legacy experiments return an empty list
      operationId: listResearchExperimentCandidates
      parameters: [{$ref: "#/components/parameters/ExperimentIdPath"}]
      responses:
        "200": {description: Adaptive candidates, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ExperimentCandidate"}}}}}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/strategies/{strategy_id}/runtime:
    get:
      tags: [Strategies]
      summary: Get normalized runtime payload for a strategy
      operationId: getStrategyRuntime
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/StrategyIdPath"
      responses:
        "200":
          description: Runtime-ready strategy payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyRuntimeOut"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/strategies/{strategy_id}/runs:
    get:
      tags: [Strategies]
      summary: List runs for one strategy
      description: >
        Intended to query strategy_runs filtered by strategy_id, with optional mode / status filters.
        This endpoint maps naturally to the Strategy -> StrategyRun relationship in the current ORM model.
      operationId: listStrategyRuns
      x-implementation-status: planned
      parameters:
        - $ref: "#/components/parameters/StrategyIdPath"
        - $ref: "#/components/parameters/RunModeFilter"
        - $ref: "#/components/parameters/RunStatusFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Strategy runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyRunSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/backtests:
    get:
      tags: [Backtests]
      summary: List manual backtests
      description: Research and verification runs are intentionally available only from their owning research experiment.
      operationId: listBacktests
      x-implementation-status: implemented
      parameters:
        - {in: query, name: strategy_id, required: false, schema: {type: string, format: uuid}}
        - {in: query, name: mode, required: false, schema: {type: string, default: backtest}}
        - {in: query, name: status, required: false, schema: {type: string}}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {in: query, name: offset, required: false, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: Manual backtest runs
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/BacktestRun"}}
    post:
      tags: [Backtests]
      summary: Queue a backtest for an existing strategy
      description: >
        Creates a StrategyRun and durable database job. Manual requests default to full persistence;
        the on-demand manager starts a spawn-based process worker with configured concurrency when automation is available. Queueing
        still succeeds when the manager is unavailable. Historical pivot-slope-atr-v2 support/resistance
        strategies are read-only and return 409 instead of creating a new run.
      operationId: createBacktest
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestCreate"
      responses:
        "201":
          description: Backtest queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestRun"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/backtests/tasks:
    get:
      tags: [Backtests]
      summary: List unified manual, research trial, and verification backtest tasks
      description: >
        Read-only task projection over existing strategy runs, durable backtest jobs, research trials,
        and verification candidates. Active tasks sort before terminal history; this endpoint does not
        create or replace an execution queue.
      operationId: listBacktestTasks
      x-implementation-status: implemented
      parameters:
        - in: query
          name: source
          required: false
          schema: {type: string, enum: [manual, research, verification]}
        - in: query
          name: stage
          required: false
          schema:
            type: string
            enum: [active, waiting_research, queued, preparing, running, finalizing, cancel_requested, completed, failed, cancelled]
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {in: query, name: offset, required: false, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: Unified backtest task page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestTaskPage"

  /api/backtests/worker-status:
    get:
      tags: [Backtests]
      summary: Get on-demand backtest worker automation status
      operationId: getBacktestWorkerStatus
      x-implementation-status: implemented
      responses:
        "200":
          description: Manager heartbeat, process capacity, worker activity, and durable queue counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestWorkerStatus"

  /api/backtests/{run_id}:
    get:
      tags: [Backtests]
      summary: Get one backtest run
      deprecated: true
      description: Legacy compatibility endpoint that loads all persisted details.
      operationId: getBacktestRun
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
      responses:
        "200":
          description: Backtest run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyRunDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Backtests]
      summary: Delete one terminal manual backtest and its run-scoped artifacts
      operationId: deleteBacktest
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
      responses:
        "200":
          description: Backtest deleted; strategy, market data, and shared support/resistance materializations retained
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BacktestDeleteResult"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/backtests/{run_id}/support-resistance:
    get:
      tags: [Backtests]
      summary: Get the entry-related support/resistance audit timeline for a backtest
      operationId: getBacktestSupportResistance
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
        - {in: query, name: symbol, required: false, schema: {type: string}}
        - {in: query, name: zone_key, required: false, schema: {type: string}}
        - {in: query, name: start_date, required: false, schema: {type: string, format: date}}
        - {in: query, name: end_date, required: false, schema: {type: string, format: date}}
      responses:
        "200":
          description: Materialization identity, sparse zone versions, and run-scoped scoring/events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportResistanceBacktest"
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}

  /api/backtests/{run_id}/signals:
    get:
      tags: [Backtests]
      summary: List signals generated by a backtest run
      operationId: listBacktestSignals
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {in: query, name: cursor, required: false, schema: {type: string}}
        - {in: query, name: symbol, required: false, schema: {type: string}}
      responses:
        "200":
          description: Signals for the requested backtest run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalPage"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/backtests/{run_id}/transactions:
    get:
      tags: [Backtests]
      summary: List simulated fills generated by a backtest run
      operationId: listBacktestTransactions
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {in: query, name: cursor, required: false, schema: {type: string}}
        - {in: query, name: symbol, required: false, schema: {type: string}}
      responses:
        "200":
          description: Transactions for the requested backtest run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/backtests/{run_id}/snapshots:
    get:
      tags: [Backtests]
      summary: List portfolio snapshots for a backtest run
      operationId: listBacktestSnapshots
      x-implementation-status: planned
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
      responses:
        "200":
          description: Portfolio snapshots for the requested backtest run
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioSnapshotRecord"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/runs:
    get:
      tags: [Runs]
      summary: List strategy runs across all modes
      operationId: listRuns
      x-implementation-status: planned
      parameters:
        - $ref: "#/components/parameters/RunModeFilter"
        - $ref: "#/components/parameters/RunStatusFilter"
        - $ref: "#/components/parameters/StrategyIdFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Strategy runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyRunSummary"

  /api/runs/{run_id}:
    get:
      tags: [Runs]
      summary: Get one strategy run
      operationId: getRun
      x-implementation-status: planned
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
      responses:
        "200":
          description: Strategy run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyRunDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/runs/{run_id}/signals:
    get:
      tags: [Runs]
      summary: List signals for a run
      operationId: listRunSignals
      x-implementation-status: planned
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
      responses:
        "200":
          description: Run signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignalRecord"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/runs/{run_id}/transactions:
    get:
      tags: [Runs]
      summary: List transactions for a run
      operationId: listRunTransactions
      x-implementation-status: planned
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
      responses:
        "200":
          description: Run transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionRecord"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/runs/{run_id}/snapshots:
    get:
      tags: [Runs]
      summary: List portfolio snapshots for a run
      operationId: listRunSnapshots
      x-implementation-status: planned
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
      responses:
        "200":
          description: Run portfolio snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioSnapshotRecord"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/paper-trading/latest-trade-date:
    get:
      tags: [Paper Trading]
      summary: Get the latest paper-trading feature date
      operationId: getLatestPaperTradingTradeDate
      x-implementation-status: implemented
      responses:
        "200":
          description: Latest available date
          content:
            application/json:
              schema:
                type: object
                properties:
                  latest_trade_date: {type: string, format: date, nullable: true}

  /api/paper-trading/run:
    post:
      tags: [Paper Trading]
      summary: Run one paper strategy
      operationId: runPaperStrategy
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PaperTradingRunRequest"}
      responses:
        "201":
          description: Paper run completed; support/resistance BUYs may await the next open
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperTradingRunOut"}

  /api/paper-trading/run-multi:
    post:
      tags: [Paper Trading]
      summary: Run allocated paper strategies
      operationId: runPaperStrategies
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MultiStrategyPaperTradingRunRequest"}
      responses:
        "201":
          description: Portfolio paper-run results
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MultiStrategyPaperTradingRunOut"}

  /api/market/bars:
    get:
      tags: [Market]
      summary: Get historical daily bars for one or more symbols
      description: >
        Designed around the current get_historical_data service, which returns daily EOD bars
        using either unadjusted or forward-adjusted prices.
      operationId: getHistoricalBars
      x-implementation-status: planned
      parameters:
        - $ref: "#/components/parameters/SymbolsQuery"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/AdjustedQuery"
      responses:
        "200":
          description: Historical bars grouped by symbol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalBarsResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/instruments/search:
    get:
      tags: [Market]
      summary: Search instruments from the security master
      operationId: searchInstruments
      x-implementation-status: planned
      parameters:
        - $ref: "#/components/parameters/InstrumentQuery"
        - $ref: "#/components/parameters/InstrumentActiveOnly"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Matching instruments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstrumentSummary"

  /api/trading/orders:
    post:
      tags: [Trading]
      summary: Place a broker order
      description: >
        Intended to wrap the current Alpaca paper-trading integration.
      operationId: createOrder
      x-implementation-status: planned
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Order accepted by the broker adapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    get:
      tags: [Trading]
      summary: List broker orders
      operationId: listOrders
      x-implementation-status: planned
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderResponse"

  /api/trading/orders/{order_id}:
    delete:
      tags: [Trading]
      summary: Cancel an order
      operationId: cancelOrder
      x-implementation-status: planned
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
      responses:
        "204":
          description: Order cancelled
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trading/positions:
    get:
      tags: [Trading]
      summary: List current broker positions
      operationId: listPositions
      x-implementation-status: planned
      responses:
        "200":
          description: Open positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"

  /api/trading/rebalance:
    post:
      tags: [Trading]
      summary: Generate or execute rebalance orders from strategy signals
      operationId: rebalancePortfolio
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RebalanceRequest"
      responses:
        "200":
          description: Rebalance result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebalanceResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

components:
  securitySchemes:
    AgentServiceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque service token
  parameters:
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        maxLength: 64
      description: Optional idempotency key used for create-order or create-strategy calls.

    RequiredIdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    ExperimentIdPath:
      in: path
      name: experiment_id
      required: true
      schema:
        type: string
        format: uuid

    StrategyIdPath:
      in: path
      name: strategy_id
      required: true
      schema:
        type: string
        format: uuid

    RunIdPath:
      in: path
      name: run_id
      required: true
      schema:
        type: string
        format: uuid

    OrderIdPath:
      in: path
      name: order_id
      required: true
      schema:
        type: string

    StrategyStatusFilter:
      in: query
      name: status
      required: false
      schema:
        $ref: "#/components/schemas/StrategyStatus"

    StrategyTypeFilter:
      in: query
      name: strategy_type
      required: false
      schema:
        $ref: "#/components/schemas/StrategyType"

    StrategyNameFilter:
      in: query
      name: name
      required: false
      schema:
        type: string
      description: Case-insensitive fuzzy match on strategy name.

    StrategyIdFilter:
      in: query
      name: strategy_id
      required: false
      schema:
        type: string
        format: uuid

    RunModeFilter:
      in: query
      name: mode
      required: false
      schema:
        $ref: "#/components/schemas/RunMode"

    RunStatusFilter:
      in: query
      name: status
      required: false
      schema:
        $ref: "#/components/schemas/RunStatus"

    SymbolsQuery:
      in: query
      name: symbols
      required: true
      description: Comma-separated ticker list, for example AAPL,MSFT,NVDA.
      schema:
        type: string
        example: AAPL,MSFT

    StartDate:
      in: query
      name: start_date
      required: true
      schema:
        type: string
        format: date

    EndDate:
      in: query
      name: end_date
      required: true
      schema:
        type: string
        format: date

    AdjustedQuery:
      in: query
      name: adjusted
      required: false
      schema:
        type: boolean
        default: false
      description: When true, return forward-adjusted prices when available.

    InstrumentQuery:
      in: query
      name: q
      required: true
      schema:
        type: string
      description: Search by canonical ticker, alias symbol, or instrument name.

    InstrumentActiveOnly:
      in: query
      name: active_only
      required: false
      schema:
        type: boolean
        default: true

    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

    Offset:
      in: query
      name: offset
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict or duplicate request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Validation or normalization error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid Agent service token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Required worker or data dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    PaperTradingRunRequest:
      type: object
      required: [strategy_id, trade_date, portfolio_name]
      properties:
        strategy_id: {type: string, format: uuid}
        trade_date: {type: string, format: date}
        portfolio_name: {type: string, default: default}
        basket_id: {type: string, format: uuid, nullable: true}
        submit_orders: {type: boolean, default: true}

    MultiStrategyPaperTradingRunRequest:
      type: object
      required: [trade_date, portfolio_name]
      properties:
        trade_date: {type: string, format: date}
        portfolio_name: {type: string, default: default}
        submit_orders: {type: boolean, default: true}
        continue_on_error: {type: boolean, default: false}

    PaperTradingRunOut:
      type: object
      required: [run_id, strategy_id, status, trade_date, portfolio_name, allocation_pct,
        capital_base, signal_count, order_count, submitted_order_count, skipped_order_count,
        failed_order_count, pending_order_count, final_cash, final_equity]
      properties:
        run_id: {type: string, format: uuid}
        strategy_id: {type: string, format: uuid}
        status: {type: string}
        trade_date: {type: string, format: date}
        portfolio_name: {type: string}
        allocation_pct: {type: number}
        capital_base: {type: number}
        signal_count: {type: integer, minimum: 0}
        order_count: {type: integer, minimum: 0}
        submitted_order_count: {type: integer, minimum: 0}
        skipped_order_count: {type: integer, minimum: 0}
        failed_order_count: {type: integer, minimum: 0}
        pending_order_count:
          type: integer
          minimum: 0
          description: Support/resistance BUY intents awaiting strict next-open validation.
        final_cash: {type: number}
        final_equity: {type: number}

    MultiStrategyPaperTradingRunOut:
      type: object
      required: [portfolio_name, trade_date, total_runs, completed_runs, failed_runs, results]
      properties:
        portfolio_name: {type: string}
        trade_date: {type: string, format: date}
        total_runs: {type: integer, minimum: 0}
        completed_runs: {type: integer, minimum: 0}
        failed_runs: {type: integer, minimum: 0}
        results:
          type: array
          items: {$ref: "#/components/schemas/PaperTradingRunOut"}

    RootResponse:
      type: object
      required: [app, message]
      properties:
        app:
          type: string
          example: Quant Backend
        message:
          type: string
          example: OK

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ErrorResponse:
      type: object
      properties:
        detail:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/FreeFormObject"
            - type: array
              items:
                $ref: "#/components/schemas/ValidationError"
      example:
        detail: strategy not found

    ValidationError:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string

    FreeFormObject:
      type: object
      additionalProperties: true

    StrategyType:
      type: string
      enum: [trend, mean_reversion, momentum_breakout, island_reversal, double_bottom, head_shoulders_bottom, rounded_bottom, v_reversal, support_resistance, custom]

    StrategyStatus:
      type: string
      enum: [draft, active, archived]

    RunMode:
      type: string
      enum: [backtest, paper, live]

    RunStatus:
      type: string
      enum: [queued, running, completed, failed, cancelled]

    SignalAction:
      type: string
      enum: [BUY, SELL, HOLD]

    TransactionSide:
      type: string
      enum: [BUY, SELL]

    BrokerOrderSide:
      type: string
      enum: [buy, sell]

    BrokerOrderType:
      type: string
      enum: [market, limit]

    IndicatorSpec:
      type: object
      required: [kind, window]
      properties:
        kind:
          type: string
          enum: [ema, sma]
        window:
          type: integer
          minimum: 1

    TrendStrategyParams:
      type: object
      required: [signal, universe, risk, execution, metadata]
      properties:
        signal:
          type: object
          required:
            [fast_indicator, slow_indicator, volume_multiplier, atr_multiplier, price_field, trigger]
          properties:
            fast_indicator:
              $ref: "#/components/schemas/IndicatorSpec"
            slow_indicator:
              $ref: "#/components/schemas/IndicatorSpec"
            volume_multiplier:
              type: number
              exclusiveMinimum: 0
            atr_multiplier:
              type: number
              exclusiveMinimum: 0
            price_field:
              type: string
              example: close
            trigger:
              type: string
              example: cross_over
            min_strength_score:
              type: number
              minimum: 0
              maximum: 100
              default: 50
        universe:
          $ref: "#/components/schemas/UniverseConfig"
        risk:
          type: object
          required: [max_positions, position_size_pct, stop_loss_atr]
          properties:
            max_positions:
              type: integer
              minimum: 1
            position_size_pct:
              type: number
              exclusiveMinimum: 0
              maximum: 1
            stop_loss_atr:
              type: number
              exclusiveMinimum: 0
        execution:
          $ref: "#/components/schemas/ExecutionConfig"
        metadata:
          $ref: "#/components/schemas/MetadataConfig"

    MeanReversionStrategyParams:
      type: object
      required: [signal, universe, risk, execution, metadata]
      properties:
        signal:
          type: object
          required: [lookback_window, zscore_entry, zscore_exit, price_field]
          properties:
            lookback_window:
              type: integer
              minimum: 1
            zscore_entry:
              type: number
              exclusiveMinimum: 0
            zscore_exit:
              type: number
              exclusiveMinimum: 0
            price_field:
              type: string
              example: close
            min_strength_score:
              type: number
              minimum: 0
              maximum: 100
              default: 50
        universe:
          $ref: "#/components/schemas/UniverseConfig"
        risk:
          type: object
          required: [max_positions, position_size_pct]
          properties:
            max_positions:
              type: integer
              minimum: 1
            position_size_pct:
              type: number
              exclusiveMinimum: 0
              maximum: 1
        execution:
          $ref: "#/components/schemas/MomentumBreakoutExecutionConfig"
        metadata:
          $ref: "#/components/schemas/MetadataConfig"

    MomentumBreakoutStrategyParams:
      type: object
      description: >-
        Daily momentum breakout parameters using existing forward-adjusted-when-available
        (otherwise unadjusted) close, SMA20, 20-day return, and volume features. Signals are evaluated at the
        day-T close and backtest fills occur at the next available session open.
      required: [signal, universe, risk, execution, metadata]
      properties:
        signal:
          type: object
          required:
            [minimum_return_20d, breakout_buffer_pct, volume_multiplier,
             exit_return_20d, price_field]
          properties:
            minimum_return_20d:
              type: number
              exclusiveMinimum: 0
              maximum: 1
            breakout_buffer_pct:
              type: number
              exclusiveMinimum: 0
              maximum: 1
            volume_multiplier:
              type: number
              exclusiveMinimum: 0
            exit_return_20d:
              type: number
              minimum: -1
              maximum: 1
            price_field:
              type: string
              enum: [close]
            min_strength_score:
              type: number
              minimum: 0
              maximum: 100
              default: 50
        universe:
          $ref: "#/components/schemas/UniverseConfig"
        risk:
          type: object
          required: [max_positions, position_size_pct, stop_loss_pct, take_profit_pct]
          properties:
            max_positions:
              type: integer
              minimum: 1
            position_size_pct:
              type: number
              exclusiveMinimum: 0
              maximum: 1
            stop_loss_pct:
              type: number
              exclusiveMinimum: 0
              maximum: 1
            take_profit_pct:
              type: number
              exclusiveMinimum: 0
              maximum: 1
        execution:
          $ref: "#/components/schemas/ExecutionConfig"
        metadata:
          $ref: "#/components/schemas/MetadataConfig"

    IslandReversalStrategyParams:
      type: object
      required: [signal, universe, risk, execution, metadata]
      properties:
        signal:
          type: object
          required:
            [downtrend_lookback, downtrend_min_drop_pct, left_gap_min_pct, right_gap_min_pct,
             min_island_bars, max_island_bars, left_volume_ratio_max, right_volume_ratio_min,
             retest_window, retest_volume_ratio_max, support_tolerance_pct]
          properties:
            downtrend_lookback:
              type: integer
              minimum: 1
            downtrend_min_drop_pct:
              type: number
              exclusiveMinimum: 0
              maximum: 1
            left_gap_min_pct:
              type: number
              exclusiveMinimum: 0
              maximum: 1
            right_gap_min_pct:
              type: number
              exclusiveMinimum: 0
              maximum: 1
            min_island_bars:
              type: integer
              minimum: 1
            max_island_bars:
              type: integer
              minimum: 1
            left_volume_ratio_max:
              type: number
              exclusiveMinimum: 0
            right_volume_ratio_min:
              type: number
              exclusiveMinimum: 0
            retest_window:
              type: integer
              minimum: 1
            retest_volume_ratio_max:
              type: number
              exclusiveMinimum: 0
            support_tolerance_pct:
              type: number
              exclusiveMinimum: 0
              maximum: 1
            min_strength_score:
              type: number
              minimum: 0
              maximum: 100
              default: 50
        universe:
          $ref: "#/components/schemas/UniverseConfig"
        risk:
          type: object
          required: [max_positions, position_size_pct, stop_loss_atr]
          properties:
            max_positions:
              type: integer
              minimum: 1
            position_size_pct:
              type: number
              exclusiveMinimum: 0
              maximum: 1
            stop_loss_atr:
              type: number
              exclusiveMinimum: 0
        execution:
          $ref: "#/components/schemas/ExecutionConfig"
        metadata:
          $ref: "#/components/schemas/MetadataConfig"

    DoubleBottomStrategyParams:
      type: object
      required: [signal, universe, risk, execution, metadata]
      properties:
        signal:
          type: object
          required:
            [downtrend_lookback, downtrend_min_drop_pct, downtrend_max_up_day_ratio,
             downtrend_min_r_squared, min_bottom_spacing, max_bottom_spacing,
             left_bottom_before_bars, left_bottom_after_bars, bottom_tolerance_pct,
             neckline_min_rebound_pct, rebound_up_day_ratio_min,
             second_bottom_volume_ratio_max, breakout_volume_ratio_min,
             max_breakout_bars_after_right_bottom, breakout_buffer_pct, retest_window,
             retest_volume_ratio_max, support_tolerance_pct]
          properties:
            min_strength_score: {type: number, minimum: 0, maximum: 100, default: 50}
            downtrend_lookback: {type: integer, minimum: 1}
            downtrend_min_drop_pct: {type: number, exclusiveMinimum: 0, maximum: 1}
            downtrend_max_up_day_ratio: {type: number, minimum: 0, maximum: 1}
            downtrend_min_r_squared: {type: number, minimum: 0, maximum: 1}
            min_bottom_spacing: {type: integer, minimum: 1}
            max_bottom_spacing: {type: integer, minimum: 1}
            left_bottom_before_bars: {type: integer, minimum: 1}
            left_bottom_after_bars: {type: integer, minimum: 1}
            bottom_tolerance_pct: {type: number, exclusiveMinimum: 0, maximum: 1}
            neckline_min_rebound_pct: {type: number, exclusiveMinimum: 0, maximum: 1}
            rebound_up_day_ratio_min: {type: number, minimum: 0, maximum: 1}
            second_bottom_volume_ratio_max: {type: number, exclusiveMinimum: 0}
            breakout_volume_ratio_min: {type: number, exclusiveMinimum: 0}
            max_breakout_bars_after_right_bottom: {type: integer, minimum: 1}
            breakout_buffer_pct: {type: number, minimum: 0, maximum: 1}
            retest_window: {type: integer, minimum: 1}
            retest_volume_ratio_max: {type: number, exclusiveMinimum: 0}
            support_tolerance_pct: {type: number, exclusiveMinimum: 0, maximum: 1}
        universe: {$ref: "#/components/schemas/UniverseConfig"}
        risk:
          type: object
          required: [max_positions, position_size_pct, stop_loss_atr, max_loss_pct, take_profit_atr]
          properties:
            max_positions: {type: integer, minimum: 1}
            position_size_pct: {type: number, exclusiveMinimum: 0, maximum: 1}
            stop_loss_atr: {type: number, exclusiveMinimum: 0}
            max_loss_pct: {type: number, exclusiveMinimum: 0, maximum: 1}
            take_profit_atr: {type: number, exclusiveMinimum: 0}
        execution: {$ref: "#/components/schemas/ExecutionConfig"}
        metadata: {$ref: "#/components/schemas/MetadataConfig"}

    SupportResistanceStrategyParams:
      type: object
      description: >-
        Causal confirmed-Pivot plus ATR sloped zones. High and low Pivots are fitted
        independently with a deterministic two-stage weighted Theil-Sen estimator.
        Session T evaluates only zones frozen after T-1; signals use adjusted OHLC and
        fill at the next session open.
      required: [signal, universe, risk, execution, metadata]
      properties:
        signal:
          type: object
          required:
            [support_bounce_enabled, resistance_breakout_enabled, breakout_retest_enabled,
             pivot_left_bars, pivot_right_bars, detection_window, min_line_pivots,
             min_line_span_sessions, line_inlier_tolerance_atr,
             max_abs_slope_atr_per_session, zone_half_width_atr, decay_half_life,
             bounce_confirmation_atr, breakout_confirmation_atr, breakout_volume_ratio_min,
             retest_window, retest_volume_ratio_max, score_outcome_window,
             score_target_atr, score_stop_atr]
          properties:
            min_strength_score: {type: number, minimum: 0, maximum: 100, default: 50}
            support_bounce_enabled: {type: boolean, default: true}
            resistance_breakout_enabled:
              type: boolean
              default: true
              description: Detect and audit direct resistance breakouts without creating executable BUY signals.
            breakout_retest_enabled: {type: boolean, default: true}
            pivot_left_bars: {type: integer, minimum: 1, default: 3}
            pivot_right_bars: {type: integer, minimum: 1, default: 3}
            detection_window: {type: integer, minimum: 7, default: 120}
            min_line_pivots: {type: integer, minimum: 3, default: 3}
            min_line_span_sessions: {type: integer, minimum: 1, default: 10}
            line_inlier_tolerance_atr: {type: number, exclusiveMinimum: 0, default: 0.75}
            max_abs_slope_atr_per_session: {type: number, exclusiveMinimum: 0, default: 0.25}
            zone_half_width_atr: {type: number, exclusiveMinimum: 0, default: 0.5}
            decay_half_life: {type: integer, minimum: 1, default: 60}
            bounce_confirmation_atr: {type: number, exclusiveMinimum: 0, default: 0.25}
            breakout_confirmation_atr: {type: number, exclusiveMinimum: 0, default: 0.5}
            breakout_volume_ratio_min: {type: number, exclusiveMinimum: 0, default: 1.5}
            retest_window: {type: integer, minimum: 1, default: 10}
            retest_volume_ratio_max: {type: number, exclusiveMinimum: 0, default: 0.8}
            score_outcome_window: {type: integer, minimum: 1, default: 20}
            score_target_atr: {type: number, exclusiveMinimum: 0, default: 3}
            score_stop_atr: {type: number, exclusiveMinimum: 0, default: 1.5}
          anyOf:
            - properties: {support_bounce_enabled: {const: true}}
            - properties: {resistance_breakout_enabled: {const: true}}
            - properties: {breakout_retest_enabled: {const: true}}
        universe: {$ref: "#/components/schemas/UniverseConfig"}
        risk:
          type: object
          required: [max_positions, position_size_pct, stop_loss_atr, max_loss_pct, take_profit_atr, min_reward_risk, max_holding_days]
          properties:
            max_positions: {type: integer, minimum: 1}
            position_size_pct: {type: number, exclusiveMinimum: 0, maximum: 1}
            stop_loss_atr: {type: number, exclusiveMinimum: 0}
            max_loss_pct: {type: number, exclusiveMinimum: 0, maximum: 1}
            take_profit_atr: {type: number, exclusiveMinimum: 0}
            min_reward_risk: {type: number, exclusiveMinimum: 0}
            max_holding_days: {type: integer, minimum: 1}
        execution:
          type: object
          required: [timeframe, rebalance, run_at]
          properties:
            timeframe: {type: string, const: 1d}
            rebalance: {type: string, const: daily}
            run_at: {type: string, const: close}
        metadata:
          type: object
          required: [description, schema_version, algorithm_version, price_semantics]
          properties:
            description: {type: string}
            schema_version: {type: integer, minimum: 1}
            algorithm_version:
              type: string
              enum: [pivot-slope-regime-v3, pivot-slope-atr-v2]
              description: pivot-slope-atr-v2 is returned only for read-only historical strategy records and cannot start a new backtest or paper execution.
            price_semantics: {type: string, const: forward_adjusted_preferred_unadjusted_fallback}

    UniverseConfig:
      type: object
      required: [symbols, selection_mode]
      properties:
        symbols:
          type: array
          items:
            type: string
          example: [AAPL, MSFT, NVDA]
        selection_mode:
          type: string
          example: manual

