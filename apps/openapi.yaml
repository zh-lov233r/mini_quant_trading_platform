        minDollarVolume20: {type: number, exclusiveMinimum: 0, default: 10000000}
        minHistorySessions: {type: integer, minimum: 20, maximum: 252, default: 200}
        membershipAsOf: {type: string, enum: [signal_close], default: signal_close}
