            platform_bars: {"type": "integer", "default": 5, "minimum": 3}
            platform_drift_atr_max: {"type": "number", "default": 1.0, "exclusiveMinimum": 0}
            platform_range_atr_max: {"type": "number", "default": 3.0, "exclusiveMinimum": 0}
            rebound_volume_ratio_max: {"type": "number", "default": 1.5, "exclusiveMinimum": 0}
            rebound_volume_ratio_min: {"type": "number", "default": 1.0, "exclusiveMinimum": 0}
            right_shoulder_volume_ratio_max: {"type": "number", "default": 0.9, "exclusiveMinimum": 0}
            shoulder_tolerance_pct: {"type": "number", "default": 0.05, "exclusiveMinimum": 0, "maximum": 1}
        universe: {$ref: "#/components/schemas/UniverseConfig"}
        risk: {$ref: "#/components/schemas/StagedBottomRiskConfig"}
        execution:
          type: object
          required: [timeframe, rebalance, run_at]
          properties:
            timeframe: {type: string, enum: [1d]}
            rebalance: {type: string, enum: [daily]}
            run_at: {type: string, enum: [close]}
        metadata: {$ref: "#/components/schemas/MetadataConfig"}

    RoundedBottomStrategyParams:
      type: object
      description: Revision 2. Daily close signals; fills at the next valid session open. Defaults are initial quantification, not optimized values.
      required: [signal, universe, risk, execution, metadata]
      properties:
        signal:
          type: object
          required: [breakout_buffer_pct, breakout_volume_ratio_min, max_lookback, min_depth_pct, min_lookback, min_pullback_spacing, min_r_squared, min_strength_score, pivot_left_bars, pivot_right_bars, pullback_volume_ratio_max, right_volume_ratio_min, vertex_position_max, vertex_position_min, weakening_buffer_pct]
          properties:
            breakout_buffer_pct: {"type": "number", "default": 0.005, "minimum": 0, "exclusiveMaximum": 1, "description": "Require a close strictly above the key price * (1 + buffer), with confirming volume."}
            breakout_volume_ratio_min: {"type": "number", "default": 1.5, "exclusiveMinimum": 0}
            max_lookback: {"type": "integer", "default": 240, "minimum": 1}
            min_depth_pct: {"type": "number", "default": 0.2, "exclusiveMinimum": 0, "maximum": 1}
            min_lookback: {"type": "integer", "default": 80, "minimum": 1}
            min_pullback_spacing: {"type": "integer", "default": 5, "minimum": 1}
            min_r_squared: {"type": "number", "default": 0.75, "minimum": 0, "maximum": 1}
            min_strength_score: {"type": "number", "default": 50.0, "minimum": 0, "maximum": 100}
            pivot_left_bars: {"type": "integer", "default": 2, "minimum": 1}
            pivot_right_bars: {"type": "integer", "default": 2, "minimum": 1}
            pullback_volume_ratio_max: {"type": "number", "default": 0.8, "exclusiveMinimum": 0}
            right_volume_ratio_min: {"type": "number", "default": 1.3, "exclusiveMinimum": 0}
            vertex_position_max: {"type": "number", "default": 0.65, "minimum": 0, "maximum": 1}
            vertex_position_min: {"type": "number", "default": 0.35, "minimum": 0, "maximum": 1}
            weakening_buffer_pct: {"type": "number", "default": 0.005, "exclusiveMinimum": 0, "exclusiveMaximum": 1}
        universe: {$ref: "#/components/schemas/UniverseConfig"}
        risk: {$ref: "#/components/schemas/StagedBottomRiskConfig"}
        execution:
          type: object
          required: [timeframe, rebalance, run_at]
          properties:
            timeframe: {type: string, enum: [1d]}
            rebalance: {type: string, enum: [daily]}
            run_at: {type: string, enum: [close]}
        metadata: {$ref: "#/components/schemas/MetadataConfig"}

    VReversalStrategyParams:
      type: object
      description: Revision 2. Daily close signals; fills at the next valid session open. Defaults are initial quantification, not optimized values.
      required: [signal, universe, risk, execution, metadata]
      properties:
        signal:
          type: object
          required: [bearish_body_atr_min, bearish_reversal_volume_ratio_min, breakout_buffer_pct, breakout_volume_ratio_min, consolidation_drift_atr_max, consolidation_max_bars, consolidation_min_bars, consolidation_range_atr_max, continuation_volume_ratio_min, continuation_window, downtrend_lookback, downtrend_min_drop_pct, min_strength_score, pivot_max_bars, pivot_volume_ratio_min, retest_volume_ratio_max, retest_window, reversal_min_atr, reversal_min_return_pct, support_tolerance_pct]
          properties:
            bearish_body_atr_min: {"type": "number", "default": 0.5, "exclusiveMinimum": 0}
            bearish_reversal_volume_ratio_min: {"type": "number", "default": 2.0, "exclusiveMinimum": 0}
            breakout_buffer_pct: {"type": "number", "default": 0.005, "minimum": 0, "exclusiveMaximum": 1, "description": "Require a close strictly above the key price * (1 + buffer), with confirming volume."}
            breakout_volume_ratio_min: {"type": "number", "default": 1.5, "exclusiveMinimum": 0}
            consolidation_drift_atr_max: {"type": "number", "default": 1.0, "exclusiveMinimum": 0}
            consolidation_max_bars: {"type": "integer", "default": 10, "minimum": 1}
            consolidation_min_bars: {"type": "integer", "default": 3, "minimum": 1}
            consolidation_range_atr_max: {"type": "number", "default": 3.0, "exclusiveMinimum": 0}
            continuation_volume_ratio_min: {"type": "number", "default": 1.2, "exclusiveMinimum": 0}
            continuation_window: {"type": "integer", "default": 5, "minimum": 1}
            downtrend_lookback: {"type": "integer", "default": 60, "minimum": 1}
            downtrend_min_drop_pct: {"type": "number", "default": 0.2, "exclusiveMinimum": 0, "maximum": 1}
            min_strength_score: {"type": "number", "default": 50.0, "minimum": 0, "maximum": 100}
            pivot_max_bars: {"type": "integer", "default": 3, "minimum": 1}
            pivot_volume_ratio_min: {"type": "number", "default": 2.0, "exclusiveMinimum": 0}
            retest_volume_ratio_max: {"type": "number", "default": 0.8, "exclusiveMinimum": 0}
            retest_window: {"type": "integer", "default": 5, "minimum": 1}
            reversal_min_atr: {"type": "number", "default": 1.5, "exclusiveMinimum": 0}
            reversal_min_return_pct: {"type": "number", "default": 0.05, "exclusiveMinimum": 0, "maximum": 1}
            support_tolerance_pct: {"type": "number", "default": 0.02, "exclusiveMinimum": 0, "maximum": 1}
        universe: {$ref: "#/components/schemas/UniverseConfig"}
        risk: {$ref: "#/components/schemas/StagedBottomRiskConfig"}
        execution:
          type: object
          required: [timeframe, rebalance, run_at]
          properties:
            timeframe: {type: string, enum: [1d]}
            rebalance: {type: string, enum: [daily]}
            run_at: {type: string, enum: [close]}
        metadata: {$ref: "#/components/schemas/MetadataConfig"}

    StagedBottomRiskConfig:
      type: object
      description: Targets must satisfy 0 < stage 1 < stage 2 < stage 3 = 1. Repeat signals only fill the remaining cumulative target.
      required: [max_loss_pct, max_positions, position_size_pct, stage_1_target_pct, stage_2_target_pct, stage_3_target_pct, stop_loss_atr, take_profit_atr]
      properties:
        max_loss_pct: {"type": "number", "default": 0.08, "exclusiveMinimum": 0, "maximum": 1}
        max_positions: {"type": "integer", "default": 6, "minimum": 1}
        position_size_pct: {"type": "number", "default": 0.15, "exclusiveMinimum": 0, "maximum": 1}
        stage_1_target_pct: {"type": "number", "default": 0.2, "exclusiveMinimum": 0, "maximum": 1}
        stage_2_target_pct: {"type": "number", "default": 0.5, "exclusiveMinimum": 0, "maximum": 1}
        stage_3_target_pct: {"type": "number", "const": 1, "default": 1}
        stop_loss_atr: {"type": "number", "default": 1.5, "exclusiveMinimum": 0}
        take_profit_atr: {"type": "number", "default": 3.0, "exclusiveMinimum": 0}

    SupportResistanceStrategyParams:
      type: object
      description: >-
        Causal confirmed-Pivot plus ATR sloped zones. High and low Pivots are fitted
        independently with a deterministic two-stage weighted Theil-Sen estimator.
        Session T evaluates only zones frozen after T-1; signals use adjusted OHLC and
        fill at the next session open.
      required: [signal, universe, risk, execution, metadata]
      properties:
        signal:
          type: object
          required:
            [support_bounce_enabled,
             pivot_left_bars, pivot_right_bars, detection_window, min_line_pivots,
             min_line_span_sessions, max_zones_per_kind, pivot_tolerance_atr, line_inlier_tolerance_atr,
             max_abs_slope_atr_per_session, zone_half_width_atr, decay_half_life,
             bounce_confirmation_atr, min_strength_score]
          properties:
            min_strength_score: {type: number, minimum: 0, maximum: 100, default: 50}
            support_bounce_enabled: {type: boolean, const: true, default: true}
            pivot_left_bars: {type: integer, minimum: 1, default: 3}
            pivot_right_bars: {type: integer, minimum: 1, default: 3}
            detection_window: {type: integer, minimum: 7, default: 120}
            min_line_pivots: {type: integer, minimum: 2, default: 2}
            min_line_span_sessions: {type: integer, minimum: 1, default: 10}
            max_zones_per_kind: {type: integer, minimum: 1, maximum: 5, default: 3}
            pivot_tolerance_atr: {type: number, minimum: 0, maximum: 0.1, default: 0.05}
            line_inlier_tolerance_atr: {type: number, exclusiveMinimum: 0, default: 0.75}
            max_abs_slope_atr_per_session: {type: number, exclusiveMinimum: 0, default: 0.25}
            zone_half_width_atr: {type: number, exclusiveMinimum: 0, default: 0.5}
            decay_half_life: {type: integer, minimum: 1, default: 60}
            bounce_confirmation_atr: {type: number, exclusiveMinimum: 0, default: 0.25}
        universe: {$ref: "#/components/schemas/UniverseConfig"}
        risk:
          type: object
          required: [max_positions, position_size_pct, stop_loss_atr, max_loss_pct, take_profit_atr, min_reward_risk, max_holding_days, risk_per_trade_pct, stop_cooldown_sessions, break_even_at_r, market_filter_enabled, market_filter_symbol]
          properties:
            max_positions: {type: integer, minimum: 1}
            position_size_pct: {type: number, exclusiveMinimum: 0, maximum: 1}
            stop_loss_atr: {type: number, exclusiveMinimum: 0}
            max_loss_pct: {type: number, exclusiveMinimum: 0, maximum: 1}
            take_profit_atr: {type: number, exclusiveMinimum: 0}
            min_reward_risk: {type: number, exclusiveMinimum: 0}
            max_holding_days: {type: integer, minimum: 1}
            risk_per_trade_pct: {type: number, exclusiveMinimum: 0, maximum: 1, default: 0.005, description: Planned stop loss budget including simulated commissions; gaps can exceed it.}
            stop_cooldown_sessions: {type: integer, minimum: 0, default: 5}
            break_even_at_r: {type: number, exclusiveMinimum: 0, default: 1}
            market_filter_enabled: {type: boolean, default: false}
            market_filter_symbol: {type: string, default: SPY, description: Stored benchmark used for a causal 200-session mean of adjusted closes.}
        execution:
          type: object
          required: [timeframe, rebalance, run_at]
          properties:
            timeframe: {type: string, const: 1d}
            rebalance: {type: string, const: daily}
            run_at: {type: string, const: close}
        metadata:
          type: object
          required: [description, schema_version, algorithm_version, price_semantics]
          properties:
            description: {type: string}
            schema_version: {type: integer, minimum: 1}
            algorithm_version:
              type: string
              enum: [pivot-slope-regime-v3, pivot-slope-atr-v2]
              description: pivot-slope-atr-v2 is returned only for read-only historical strategy records and cannot start a new backtest or paper execution.
            price_semantics: {type: string, const: forward_adjusted_preferred_unadjusted_fallback}

    UniverseConfig:
      type: object
      required: [symbols, selection_mode]
      properties:
        symbols:
          type: array
          items:
            type: string
          example: [AAPL, MSFT, NVDA]
        selection_mode:
          type: string
          example: manual

