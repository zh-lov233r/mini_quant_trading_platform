  /api/trading/orders:
    post:
      tags: [Trading]
      summary: Place a broker order
      description: >
        Intended to wrap the current Alpaca paper-trading integration.
      operationId: createOrder
      x-implementation-status: planned
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Order accepted by the broker adapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    get:
      tags: [Trading]
      summary: List broker orders
      operationId: listOrders
      x-implementation-status: planned
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderResponse"

  /api/trading/orders/{order_id}:
    delete:
      tags: [Trading]
      summary: Cancel an order
      operationId: cancelOrder
      x-implementation-status: planned
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
      responses:
        "204":
          description: Order cancelled
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trading/positions:
    get:
      tags: [Trading]
      summary: List current broker positions
      operationId: listPositions
      x-implementation-status: planned
      responses:
        "200":
          description: Open positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"

  /api/trading/rebalance:
    post:
      tags: [Trading]
      summary: Generate or execute rebalance orders from strategy signals
      operationId: rebalancePortfolio
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RebalanceRequest"
      responses:
        "200":
          description: Rebalance result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebalanceResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/backtests/{run_id}/retry:
    post:
      tags: [Backtests]
      summary: Retry one failed manual or verification backtest as a new run
      description: >
        Creates a new queued StrategyRun and durable job from the failed job payload while retaining
        the original failed run for audit. A failed run can create at most one direct retry. Research
        trials remain owned by their experiment workflow and cannot be retried through this endpoint.
      operationId: retryBacktest
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
      responses:
        "202":
          description: New retry run queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BacktestRun"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

components:
  securitySchemes:
    AgentServiceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque service token
  parameters:
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        maxLength: 64
      description: Optional idempotency key used for create-order or create-strategy calls.

    RequiredIdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    ExperimentIdPath:
      in: path
      name: experiment_id
      required: true
      schema:
        type: string
        format: uuid

    StrategyIdPath:
      in: path
      name: strategy_id
      required: true
      schema:
        type: string
        format: uuid

    RunIdPath:
      in: path
      name: run_id
      required: true
      schema:
        type: string
        format: uuid

    OrderIdPath:
      in: path
      name: order_id
      required: true
      schema:
        type: string

    StrategyStatusFilter:
      in: query
      name: status
      required: false
      schema:
        $ref: "#/components/schemas/StrategyStatus"

    StrategyTypeFilter:
      in: query
      name: strategy_type
      required: false
      schema:
        $ref: "#/components/schemas/StrategyType"

    StrategyNameFilter:
      in: query
      name: name
      required: false
      schema:
        type: string
      description: Case-insensitive fuzzy match on strategy name.

    StrategyIdFilter:
      in: query
      name: strategy_id
      required: false
      schema:
        type: string
        format: uuid

    RunModeFilter:
      in: query
      name: mode
      required: false
      schema:
        $ref: "#/components/schemas/RunMode"

    RunStatusFilter:
      in: query
      name: status
      required: false
      schema:
        $ref: "#/components/schemas/RunStatus"

    SymbolsQuery:
      in: query
      name: symbols
      required: true
      description: Comma-separated ticker list, for example AAPL,MSFT,NVDA.
      schema:
        type: string
        example: AAPL,MSFT

    StartDate:
      in: query
      name: start_date
      required: true
      schema:
        type: string
        format: date

    EndDate:
      in: query
      name: end_date
      required: true
      schema:
        type: string
        format: date

    AdjustedQuery:
      in: query
      name: adjusted
      required: false
      schema:
        type: boolean
        default: false
      description: When true, return forward-adjusted prices when available.

    InstrumentQuery:
      in: query
      name: q
      required: true
      schema:
        type: string
      description: Search by canonical ticker, alias symbol, or instrument name.

    InstrumentActiveOnly:
      in: query
      name: active_only
      required: false
      schema:
        type: boolean
        default: true

    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

    Offset:
      in: query
      name: offset
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict or duplicate request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Validation or normalization error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid Agent service token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Required worker or data dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    StockFilters:
      type: object
      description: Industry and cap bounds require market. Cap amounts are base currency units; min_cap must not exceed max_cap.
      properties:
        market: {type: [string, "null"], enum: [US, CN, null], default: null}
        query: {type: string, maxLength: 100, default: ""}
        industry: {type: [string, "null"], maxLength: 256, default: null}
        min_cap: {type: [number, "null"], minimum: 0, maximum: 1.0e20, default: null}
        max_cap: {type: [number, "null"], exclusiveMinimum: 0, maximum: 1.0e20, default: null}
    StockCandidate:
      type: object
      required: [instrument_id, ticker, name, market, industry, industry_source, market_cap, currency, cap_source, cap_data_date, cap_retrieved_at]
      properties:
        instrument_id: {type: integer}
        ticker: {type: string}
        name: {type: [string, "null"]}
        market: {type: string, enum: [US, CN]}
        industry: {type: [string, "null"]}
        industry_source: {type: string, enum: [SIC, Tushare]}
        market_cap: {type: [number, "null"], description: Latest known amount in base currency units}
        currency: {type: string}
        cap_source: {type: [string, "null"]}
        cap_data_date: {type: [string, "null"], format: date}
        cap_retrieved_at: {type: [string, "null"], format: date-time}
    StockSearchResult:
      type: object
      required: [items, total, missing_market_cap]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/StockCandidate"}}
        total: {type: integer, minimum: 0}
        missing_market_cap: {type: integer, minimum: 0}
    StockBasketInput:
      type: object
      required: [name, symbols]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, nullable: true, maxLength: 500}
        symbols: {type: array, minItems: 1, items: {type: string}}
        status: {type: string, enum: [draft, active, archived], default: active}
    StockBasket:
      allOf:
        - $ref: "#/components/schemas/StockBasketInput"
        - type: object
          required: [id, name, symbols, status, symbol_count]
          properties:
            id: {type: string, format: uuid}
            symbol_count: {type: integer}
            created_at: {type: string, format: date-time, nullable: true}
            updated_at: {type: string, format: date-time, nullable: true}
    DashboardActivity:
      properties:
        strategy_type: {type: string, nullable: true, description: Strategy category for backtest and paper activity colors}
        id:
          title: Id
          type: string
        category:
          enum:
            - backtest
            - research
            - strategy
            - paper
          title: Category
          type: string
        status:
          title: Status
          type: string
        name:
          title: Name
          type: string
        occurred_at:
          format: date-time
          title: Occurred At
          type: string
        href:
          title: Href
          type: string
      required:
        - id
        - category
        - status
        - name
        - occurred_at
        - href
      title: DashboardActivity
      type: object
    DashboardAlert:
      properties:
        id:
          title: Id
          type: string
        code:
          title: Code
          type: string
        severity:
          enum:
            - critical
            - warning
            - info
          title: Severity
