          type: string
          enum: [total_return, sharpe, max_drawdown, excess_return]
        operator: {type: string, enum: [gte, lte]}
        value: {type: number}
        sampleKind: {type: string, enum: [in_sample, out_of_sample]}
        costScenario: {type: string, minLength: 1, maxLength: 64}

