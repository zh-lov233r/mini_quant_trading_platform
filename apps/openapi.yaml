        description: {type: [string, "null"], maxLength: 500}
        strategy_type:
          type: string
          enum: [trend, mean_reversion, momentum_breakout, island_reversal, double_bottom]
        overrides:
          type: array
          maxItems: 30
          items:
            type: object
            required: [path, value]
            properties:
              path: {type: string}
              value: {}
        symbols:
          type: array
          minItems: 1
          maxItems: 500
          items: {type: string}

