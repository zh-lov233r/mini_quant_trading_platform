            second_bottom_volume_ratio_max: {"type": "number", "default": 0.9, "exclusiveMinimum": 0}
            support_tolerance_pct: {"type": "number", "default": 0.02, "exclusiveMinimum": 0, "maximum": 1}
        universe: {$ref: "#/components/schemas/UniverseConfig"}
        risk: {$ref: "#/components/schemas/StagedBottomRiskConfig"}
        execution:
          type: object
          required: [timeframe, rebalance, run_at]
