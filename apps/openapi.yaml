      type: object
      required: [valid, engine_ready, normalized_params]
      properties:
        valid:
          type: boolean
        engine_ready:
          type: boolean
        normalized_params:
          $ref: "#/components/schemas/FreeFormObject"

    StrategyProposal:
      type: object
      required: [name, strategy_type, overrides, symbols]
      properties:
