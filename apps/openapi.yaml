            max_breakout_bars_after_right_bottom: {"type": "integer", "default": 40, "minimum": 1}
            min_bottom_spacing: {"type": "integer", "default": 5, "minimum": 1}
            min_strength_score: {"type": "number", "default": 50.0, "minimum": 0, "maximum": 100}
            neckline_min_rebound_pct: {"type": "number", "default": 0.06, "exclusiveMinimum": 0, "maximum": 1}
            rebound_up_day_ratio_min: {"type": "number", "default": 0.6, "minimum": 0, "maximum": 1}
            rebound_volume_ratio_max: {"type": "number", "default": 1.5, "exclusiveMinimum": 0}
