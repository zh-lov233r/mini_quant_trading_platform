        windowStart: {type: string, format: date}
        windowEnd: {type: string, format: date}
        costConfig: {$ref: "#/components/schemas/FreeFormObject"}
        dataFingerprint: {type: [string, "null"]}
        backtestRunId: {type: [string, "null"], format: uuid}
        metrics: {$ref: "#/components/schemas/FreeFormObject"}
