            left_gap_min_pct: {"type": "number", "default": 0.02, "exclusiveMinimum": 0, "maximum": 1}
            left_volume_ratio_max: {"type": "number", "default": 0.8, "exclusiveMinimum": 0}
            max_island_bars: {"type": "integer", "default": 8, "minimum": 1}
            min_island_bars: {"type": "integer", "default": 1, "minimum": 1}
            min_strength_score: {"type": "number", "default": 50.0, "minimum": 0, "maximum": 100}
            previous_body_atr_min: {"type": "number", "default": 0.5, "exclusiveMinimum": 0}
            retest_volume_ratio_max: {"type": "number", "default": 0.7, "exclusiveMinimum": 0}
            retest_window: {"type": "integer", "default": 10, "minimum": 1}
            right_gap_min_pct: {"type": "number", "default": 0.02, "exclusiveMinimum": 0, "maximum": 1}
            right_volume_ratio_min: {"type": "number", "default": 1.5, "exclusiveMinimum": 0}
            support_tolerance_pct: {"type": "number", "default": 0.01, "exclusiveMinimum": 0, "maximum": 1}
